<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Новая вкладка</title>
  <style>
    :root {
      color-scheme: light dark;
      /* Dynamic Theme Variables (overridden by newtab.js) */
      --theme-bg: #202124;
      --theme-card-bg: rgba(255, 255, 255, 0.08);
      --theme-card-border: rgba(255, 255, 255, 0.12);
      --theme-text: #ffffff;
      --theme-text-subtle: rgba(255, 255, 255, 0.7);
      --theme-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      --md-sys-font-family: 'Google Sans', 'Roboto', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--theme-bg);
      color: var(--theme-text);
      font-family: var(--md-sys-font-family);
      overflow: hidden;
      user-select: none;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 12vh;
      position: relative;
    }

    /* Material 3 Digital Clock Container */
    .m3-clock-card {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 48px;
      background-color: var(--theme-card-bg);
      border-radius: 32px;
      border: 1px solid var(--theme-card-border);
      box-shadow: var(--theme-shadow);
      cursor: default;
      /* No hover effects or transitions that highlight on hover */
      transition: none;
    }

    /* M3 Display Typography */
    .m3-time {
      font-size: 4.75rem;
      font-weight: 400;
      line-height: 1;
      letter-spacing: -1.5px;
      color: var(--theme-text);
      font-variant-numeric: tabular-nums;
      display: flex;
      align-items: baseline;
    }

    .m3-time-colon {
      opacity: 0.85;
      padding: 0 2px;
    }

    .m3-date {
      margin-top: 10px;
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 0.15px;
      color: var(--theme-text-subtle);
      text-transform: capitalize;
    }

    /* Minimalist Floating Theme Sync Tool in Bottom Corner */
    .theme-tool-wrap {
      position: fixed;
      bottom: 24px;
      right: 24px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 12px;
      z-index: 100;
    }

    .theme-trigger-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid var(--theme-card-border);
      background-color: var(--theme-card-bg);
      color: var(--theme-text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0.25;
      transition: opacity 0.2s ease, transform 0.2s ease, background-color 0.2s ease;
      backdrop-filter: blur(8px);
    }

    .theme-tool-wrap:hover .theme-trigger-btn,
    .theme-trigger-btn:focus-visible,
    .theme-tool-wrap.open .theme-trigger-btn {
      opacity: 0.95;
      transform: scale(1.05);
    }

    /* Theme Picker Popup Card */
    .theme-popup {
      display: none;
      flex-direction: column;
      gap: 12px;
      padding: 16px;
      background-color: var(--theme-card-bg);
      backdrop-filter: blur(24px);
      border: 1px solid var(--theme-card-border);
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      width: 260px;
      color: var(--theme-text);
      animation: fadeIn 0.15s ease-out;
    }

    .theme-tool-wrap.open .theme-popup {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .theme-popup-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--theme-text);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .theme-btn-action {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 8px 12px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      border-radius: 12px;
      border: 1px solid var(--theme-card-border);
      background-color: rgba(255, 255, 255, 0.1);
      color: var(--theme-text);
      cursor: pointer;
      transition: filter 0.15s ease;
    }

    .theme-btn-action:hover {
      filter: brightness(1.15);
    }

    /* Preset color swatches */
    .swatches-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .swatch-btn {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.12s;
    }

    .swatch-btn:hover {
      transform: scale(1.15);
    }

    .theme-status-text {
      font-size: 11px;
      color: var(--theme-text-subtle);
      line-height: 1.3;
    }
  </style>
</head>
<body>
  <!-- M3 Digital Clock without hover highlight -->
  <main class="m3-clock-card" id="clock-card" aria-label="Часы">
    <div class="m3-time" id="clock-time">
      <span id="hours">--</span><span class="m3-time-colon">:</span><span id="minutes">--</span>
    </div>
    <div class="m3-date" id="clock-date">--</div>
  </main>

  <!-- Theme Detection & Sync Widget -->
  <div class="theme-tool-wrap" id="theme-widget">
    <div class="theme-popup" id="theme-popup">
      <div class="theme-popup-title">
        <span>Цвет темы браузера</span>
        <span id="active-hex" style="font-family:monospace; font-size:11px; opacity:0.8;">#---</span>
      </div>

      <!-- EyeDropper API Button -->
      <button class="theme-btn-action" id="btn-eyedropper" title="Нажмите и кликните по вкладке или панели браузера">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="m14 2 4 4L7 17l-4 1 1-4 11-11z" />
          <path d="m13 7 4 4" />
        </svg>
        <span>Пипетка (взять цвет браузера)</span>
      </button>

      <!-- Auto detect button -->
      <button class="theme-btn-action" id="btn-autodetect" title="Считать цвет темы системы или установленной темы">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
          <path d="M3 3v5h5" />
          <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16" />
          <path d="M16 21h5v-5" />
        </svg>
        <span>Авто-определение темы</span>
      </button>

      <!-- Preset Chrome Palettes -->
      <div class="swatches-grid" id="swatches-container"></div>

      <div class="theme-status-text" id="theme-status-info">
        Синхронизировано с цветом интерфейса
      </div>
    </div>

    <!-- Floating Trigger Icon Button -->
    <button class="theme-trigger-btn" id="theme-trigger" aria-label="Настроить цвет темы" title="Цвет темы браузера">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10" />
        <path d="M12 2a10 10 0 0 1 10 10c0 5.523-4.477 10-10 10a10 10 0 0 1-10-10C2 6.477 6.477 2 12 2z" />
        <path d="M12 2v20" />
      </svg>
    </button>
  </div>

  <script src="newtab.js"></script>
</body>
</html>
